aid: khmer-home
name: Khmer Home
description: Khmerhome (khmerhome.com) is Cambodia's real estate marketplace, based in
  Phnom Penh, connecting buyers, renters, and property owners across houses, apartments,
  condos, villas, boreys, land, warehouses, and commercial spaces. The platform offers
  property search and browsing, sales and rental listings with photos and agent details,
  property valuation and appraisal tools, an articles section covering Cambodian
  economic and property developments, and community events for real estate
  professionals and expats. Khmerhome ships native iOS and Android mobile apps and
  operates alongside sister sites khmerload.com and khmercars.com. It was surfaced as
  a portfolio company of 500 Global and profiled in the API Evangelist network. No
  public developer/API surface, OpenAPI specification, or documentation portal has
  been found at this time.
